version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sprint_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sprint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sprint_backend
    expose:
      - "5001"
    env_file:
      - ./backend/.env
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_NAME=sprint_db
      - DB_PORT=5432
      - PORT=5001
      - FRONTEND_URL=https://${DOMAIN}
      - FORTYTWO_APP_REDIRECT_URI=https://${DOMAIN}/api/auth/42/callback
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: sprint_frontend
    expose:
      - "3000"
    environment:
      - VITE_ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - VITE_DOMAIN=${DOMAIN}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: sprint_proxy
    ports:
      - "${EXTERNAL_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
