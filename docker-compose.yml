version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sprint_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sprint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sprint_backend
    ports:
      - "5001:5001"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_NAME=sprint_db
      - DB_PORT=5432
      - PORT=5001
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: sprint_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend

volumes:
  postgres_data:
