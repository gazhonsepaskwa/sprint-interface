version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sprint_db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sprint_backend
    expose:
      - "5001"
    env_file: .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: sprint_frontend
    expose:
      - "3000"
    env_file: .env
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: sprint_proxy
    ports:
      - "${EXTERNAL_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
